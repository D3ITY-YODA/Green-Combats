name: backend-ci

on:
  pull_request:
    paths:
      - 'green-compass-backend/**'
      - 'development/**'
  push:
    branches: [main, development, backend]
    paths:
      - 'green-compass-backend/**'
      - 'development/**'

defaults:
  run:
    working-directory: green-compass-backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: green-compass-backend/go.mod
          cache-dependency-path: green-compass-backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: green-compass-backend

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: green-compass-backend/go.mod
          cache-dependency-path: green-compass-backend/go.sum
      - name: Run unit tests (integration tests skip without DB)
        run: go test -race -count=1 ./...

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: greencompass
          POSTGRES_PASSWORD: greencompass
          POSTGRES_DB: greencompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greencompass -d greencompass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      GC_TEST_DATABASE_URL: postgres://greencompass:greencompass@127.0.0.1:5432/greencompass?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: green-compass-backend/go.mod
          cache-dependency-path: green-compass-backend/go.sum
      - name: Run all tests against Postgres
        run: go test -race -count=1 ./...

  migration-check:
    name: Migration up/down cycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: greencompass
          POSTGRES_PASSWORD: greencompass
          POSTGRES_DB: greencompass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greencompass -d greencompass"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: green-compass-backend/go.mod
          cache-dependency-path: green-compass-backend/go.sum
      - name: Apply all migrations
        run: go run ./cmd/migrate -dsn ${{ env.DSN }} up
        env:
          DSN: postgres://greencompass:greencompass@127.0.0.1:5432/greencompass?sslmode=disable
      - name: Revert all migrations
        run: go run ./cmd/migrate -dsn ${{ env.DSN }} down
        env:
          DSN: postgres://greencompass:greencompass@127.0.0.1:5432/greencompass?sslmode=disable

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: green-compass-backend/go.mod
          cache-dependency-path: green-compass-backend/go.sum
      - name: Build all binaries
        run: |
          CGO_ENABLED=0 go build -o /tmp/api ./cmd/api
          CGO_ENABLED=0 go build -o /tmp/worker ./cmd/worker
          CGO_ENABLED=0 go build -o /tmp/scheduler ./cmd/scheduler
          CGO_ENABLED=0 go build -o /tmp/notifier ./cmd/notifier
          CGO_ENABLED=0 go build -o /tmp/migrate ./cmd/migrate