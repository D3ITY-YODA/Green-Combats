name: frontend-ci

on:
  pull_request:
    paths:
      - 'frontend-web/**'
      - 'development/**'
  push:
    branches: [main, development,frontend-web]
    paths:
      - 'frontend-web/**'
      - 'development/**'

defaults:
  run:
    working-directory: frontend-web

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # BLOCKED: typescript-eslint does not support TypeScript 7.0 yet.
    # Track: https://github.com/typescript-eslint/typescript-eslint/issues/10940
    # Re-enable once typescript-eslint adds TS 7 support.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npx vitest run --reporter=verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
