components:
  schemas:
    PlaceInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        place_type: { type: string, enum: [community, ward, district, custom] }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        label: { type: string, nullable: true }
        is_primary: { type: boolean, default: false }
      required: [id, name, place_type, lat, lon]

    Update:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        place_name: { type: string }
        content_type: { type: string, enum: [today, forecast, alert] }
        headline: { type: string }
        body_text: { type: string }
        call_to_action: { type: string, nullable: true }
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/Indicator'
        generated_at: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
      required: [id, place_id, place_name, content_type, headline, body_text, generated_at, period_start, period_end]

    Indicator:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        display_name: { type: string }
        value: { type: number, format: double }
        unit: { type: string }
        trend: { type: string, nullable: true, enum: [increasing, stable, decreasing] }
        relevance_score: { type: number, format: double }
      required: [id, code, display_name, value, unit, relevance_score]

    ExploreIndicator:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        place_name: { type: string }
        code: { type: string }
        display_name: { type: string }
        category: { type: string }
        value: { type: number, format: double }
        unit: { type: string }
        trend: { type: string, nullable: true }
        trend_confidence: { type: number, format: double, nullable: true }
        computed_at: { type: string, format: date-time }
      required: [id, place_id, place_name, code, display_name, category, value, unit, computed_at]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }
      required: [page, page_size, total]

    ResponseMeta:
      type: object
      properties:
        request_id: { type: string }
        generated_at: { type: string, format: date-time }
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [request_id, generated_at]

    SuccessResponse:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required: [data, meta]

    PaginatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required: [data, meta]

    Envelope:
      type: object
      description: Legacy alias for the response envelope.
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: {}
      required: [code, message]

    Observation:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        place_id: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        category:
          type: string
          enum: [flood, drought, water_quality, crop_damage, air_quality, other]
        description: { type: string }
        photo_object_key: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, verified, rejected, flagged]
        verified_by: { type: string, format: uuid, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, reporter_id, category, description, status, created_at, updated_at]

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        place_id: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        category:
          type: string
          enum: [flood, drought, water_quality, crop_damage, air_quality, other]
        description: { type: string }
        photo_object_key: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, verified, rejected, flagged]
        verified_by: { type: string, format: uuid, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, reporter_id, category, description, status, created_at, updated_at]

    # --- Auth & User schemas ---

    UserWithTokens:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            email: { type: string, format: email, nullable: true }
            phone_number: { type: string, nullable: true }
            language: { type: string }
            is_platform_admin: { type: boolean }
        tokens:
          $ref: '#/components/schemas/TokenPair'

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at]

    TokenPairResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'

    UserResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
            email: { type: string, format: email, nullable: true }
            phone_number: { type: string, nullable: true }
            language: { type: string }
            is_platform_admin: { type: boolean }

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              display_name: { type: string }
              email: { type: string, format: email, nullable: true }
              phone_number: { type: string, nullable: true }

    # --- Notification schemas ---

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        channel: { type: string, enum: [push, sms, ussd, email] }
        event_type: { type: string }
        title: { type: string }
        body: { type: string }
        metadata: { type: object }
        status: { type: string, enum: [pending, sent, failed, cancelled] }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
      required: [id, user_id, channel, event_type, title, body, status, created_at]

    NotificationResponse:
      type: object
      properties:
        notification:
          $ref: '#/components/schemas/Notification'

    PaginatedNotifications:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    NotificationPreference:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        channel: { type: string, enum: [push, sms, ussd, email] }
        event_type: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PreferencesResponse:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'

    UpdatePreferenceRequest:
      type: object
      required: [channel, event_type, enabled]
      properties:
        channel: { type: string, enum: [push, sms, ussd, email] }
        event_type: { type: string }
        enabled: { type: boolean }

    # --- Audit schemas ---

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid, nullable: true }
        actor_org_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, format: uuid, nullable: true }
        details: { type: object }
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, action, resource_type, created_at]

    PaginatedAuditEntries:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    # --- Project schemas ---

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        start_date: { type: string, format: date-time, nullable: true }
        end_date: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, org_id, name, status, created_at, updated_at]

    ProjectResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'

    PaginatedProjects:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    CreateProjectRequest:
      type: object
      required: [org_id, name]
      properties:
        org_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }

    # --- Context schema ---

    ContextResponse:
      type: object
      properties:
        primary_place:
          $ref: '#/components/schemas/PlaceInfo'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/Update'
        saved_places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceInfo'

    # --- Error schema ---

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: The requested resource could not be found. }
            request_id: { type: string, example: req_123 }
          required: [code, message, request_id]
      required: [error]
