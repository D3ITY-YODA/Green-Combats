openapi: 3.0.3
info:
  title: GreenCompass API
  description: |
    Location-aware climate and environmental information service.
    Provides plain-language updates, community observations, and institutional reporting.

    All responses use a standard envelope:
    - Success: `{ "data": ..., "meta": { "request_id", "generated_at", "pagination"? } }`
    - Error: `{ "error": { "code", "message", "request_id" } }`

    Mutating requests should send an `Idempotency-Key` header; repeated keys
    return the original response. Rate limits return `429` with `Retry-After`.
  version: 1.1.0
  contact:
    name: GreenCompass Team

servers:
  - url: http://localhost:8080/v1
    description: Local development
  - url: https://api.greencompass.org/v1
    description: Production

tags:
