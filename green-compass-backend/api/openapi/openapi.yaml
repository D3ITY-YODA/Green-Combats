    description: Authentication and user registration
  - name: users
    description: User management
  - name: places
    description: Location and place management
  - name: preferences
    description: User saved places
  - name: context
    description: Place context and Today screen
  - name: explore
    description: Topic-scoped indicator exploration
  - name: updates
    description: Climate updates feed
  - name: observations
    description: Community observations
  - name: reports
    description: Institutional review queue
  - name: notifications
    description: Notification preferences and records
  - name: console
    description: Institutional console (overview, sources, projects)
  - name: audit
    description: Audit trail
  - name: projects
    description: Institutional projects
  - name: reporting
    description: Impact metrics and dashboards
  - name: integrations
    description: Provider webhooks (SMS, USSD, push, source callbacks)
  - name: health
    description: Health checks and metrics

