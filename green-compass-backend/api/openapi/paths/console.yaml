overview:
  get:
    tags: [console]
    summary: Institutional console overview
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Overview payload
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

localConditions:
  get:
    tags: [console]
    summary: Current local conditions for console
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Conditions summary

sources:
  get:
    tags: [console]
    summary: List data sources with health status
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Source list with enabled/health state

projects:
  get:
    tags: [console]
    summary: List institutional projects
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: org_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 20 } }
    responses:
      '200':
        description: Paginated project list
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'

projectsCrud:
  post:
    tags: [projects]
    summary: Create a project
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [org_id, name]
            properties:
              org_id: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
    responses:
      '201':
        description: Project created
  get:
    tags: [projects]
    summary: List projects for an organization
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: org_id, in: query, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Project list

activity:
  get:
    tags: [console]
    summary: Recent organization activity
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Activity feed

audit:
  get:
    tags: [audit]
    summary: List audit trail entries
    description: Non-admin users see only their own entries.
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 20 } }
      - { name: action, in: query, schema: { type: string } }
      - { name: resource_type, in: query, schema: { type: string } }
    responses:
      '200':
        description: Audit entries
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'