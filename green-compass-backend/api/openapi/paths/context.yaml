today:
  get:
    tags: [context]
    summary: Today screen content for a place
    description: Returns the current context and latest plain-language update for the place.
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Today payload (place + update)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'
      '404':
        $ref: '../components/schemas.yaml#/ErrorResponse'

placeContext:
  get:
    tags: [context]
    summary: Context for a specific place
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Place context
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'

legacyToday:
  get:
    tags: [context]
    summary: Resolve user's current context (legacy)
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: query, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Resolved context

preferences:
  get:
    tags: [preferences]
    summary: List the user's saved places
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Saved places
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'

savedPlace:
  put:
    tags: [preferences]
    summary: Save a place for the user
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              label: { type: string }
    responses:
      '201':
        description: Place saved
      '409':
        $ref: '../components/schemas.yaml#/ErrorResponse'
  delete:
    tags: [preferences]
    summary: Remove a saved place
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Place removed

primaryPlace:
  put:
    tags: [preferences]
    summary: Set a saved place as primary
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Primary updated