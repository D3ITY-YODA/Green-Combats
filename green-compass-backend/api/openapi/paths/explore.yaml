global:
  get:
    tags: [explore]
    summary: Explore computed indicators across places
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: category, in: query, schema: { type: string }, description: Filter by category (weather, water, agriculture, air_quality) }
      - { name: place_id, in: query, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    responses:
      '200':
        description: Paginated list of explore indicators
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

byPlace:
  get:
    tags: [explore]
    summary: Explore indicators for a specific place
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: category, in: query, schema: { type: string } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 50 } }
    responses:
      '200':
        description: Place-scoped indicator list
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

topic:
  get:
    tags: [explore]
    summary: Topic-scoped indicators for a place
    description: >-
      Served at /places/{place_id}/local-outlook, /seasonal, /water,
      /land-ecosystems, /food-agriculture and /community. Each route maps to
      its topic key; only applicable indicators are returned (no empty cards).
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 50 } }
    responses:
      '200':
        description: Topic indicators for the place
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'