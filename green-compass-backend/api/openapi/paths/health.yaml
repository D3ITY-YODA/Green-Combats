get:
  tags: [health]
  summary: Health check
  security: []
  responses:
    '200':
      description: Service is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              version:
                type: string
                example: dev
              timestamp:
                type: string
                format: date-time
