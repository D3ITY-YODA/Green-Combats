notifications:
  get:
    tags: [notifications]
    summary: List notifications
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, sent, failed, cancelled]
    responses:
      '200':
        description: Notification list
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedNotifications'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

  /{id}:
    get:
      tags: [notifications]
      summary: Get notification by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                $ref: '../components/schemas.yaml#/NotificationResponse'
        '401':
          $ref: '../components/schemas.yaml#/ErrorResponse'
        '404':
          $ref: '../components/schemas.yaml#/ErrorResponse'

preferences:
  get:
    tags: [notifications]
    summary: List notification preferences
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Preferences list
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PreferencesResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

  put:
    tags: [notifications]
    summary: Update notification preference
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UpdatePreferenceRequest'
    responses:
      '200':
        description: Preference updated
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'
      '400':
        $ref: '../components/schemas.yaml#/ErrorResponse'
