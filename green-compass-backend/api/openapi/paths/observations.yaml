paths:
  /v1/observations:
    post:
      summary: Submit a community observation
      description: >-
        Submit a new environmental observation with optional photo and
        location. Either place_id or lat/lon must be provided.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                place_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional place UUID
                lat:
                  type: number
                  format: double
                  nullable: true
                lon:
                  type: number
                  format: double
                  nullable: true
                category:
                  type: string
                  enum: [flood, drought, water_quality, crop_damage, air_quality, other]
                description:
                  type: string
                  maxLength: 2000
                photo_object_key:
                  type: string
                  nullable: true
                  description: Pre-uploaded photo object key
      responses:
        '201':
          description: Observation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: List current user's observations
      description: >-
        Returns a paginated list of observations submitted by the
        authenticated user.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list of user observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    type: object
                    properties:
                      observations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/observations/{id}:
    get:
      summary: Get a single observation
      description: >-
        Returns details for a specific observation. The caller must be
        the reporter or a platform admin.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Observation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/observations/institutional/pending:
    get:
      summary: List pending observations for institutional review
      description: >-
        Returns a paginated list of observations pending verification.
        Requires platform admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list of pending observations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    type: object
                    properties:
                      observations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden

  /v1/observations/institutional/{id}/verify:
    patch:
      summary: Verify or reject an observation
      description: >-
        Update the status of an observation to verified, rejected, or
        flagged. Requires platform admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, rejected, flagged]
      responses:
        '200':
          description: Updated observation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    $ref: '#/components/schemas/Observation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'
