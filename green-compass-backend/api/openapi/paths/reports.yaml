paths:
  /v1/reports/pending:
    get:
      summary: List pending reports for institutional review
      description: >-
        Returns a paginated list of community observations awaiting
        institutional verification. Requires platform admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list of pending reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden

  /v1/reports/{id}:
    get:
      summary: Get a single report
      description: >-
        Returns details for a specific observation report. Requires
        platform admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/reports/{id}/verify:
    patch:
      summary: Verify or reject a report
      description: >-
        Update the status of an observation to verified, rejected, or
        flagged. Requires platform admin role.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [verified, rejected, flagged]
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [success], default: success }
                  data:
                    $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'
