types:
  get:
    tags: [reports]
    summary: List available community report types
    security: [{ bearerAuth: [] }]
    responses:
      '200':
        description: Report type catalogue
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'

pending:
  get:
    tags: [reports]
    summary: List pending reports for institutional review
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
    responses:
      '200':
        description: Pending report queue
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '403':
        $ref: '../components/schemas.yaml#/ErrorResponse'

detail:
  get:
    tags: [reports]
    summary: Get a single report
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Report detail
      '404':
        $ref: '../components/schemas.yaml#/ErrorResponse'

verify:
  patch:
    tags: [reports]
    summary: Verify or reject a report (institutional reviewer)
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [verified, rejected] }
    responses:
      '200':
        description: Updated report
      '403':
        $ref: '../components/schemas.yaml#/ErrorResponse'

deliveryStats:
  get:
    tags: [reporting]
    summary: Notification delivery metrics for a place
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: period_start, in: query, schema: { type: string, format: date-time } }
      - { name: period_end, in: query, schema: { type: string, format: date-time } }
    responses:
      '200':
        description: Delivery statistics

dashboard:
  get:
    tags: [reporting]
    summary: Combined impact dashboard
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: org_id, in: query, schema: { type: string, format: uuid } }
      - { name: place_id, in: query, schema: { type: string, format: uuid } }
      - { name: period_start, in: query, schema: { type: string, format: date-time } }
      - { name: period_end, in: query, schema: { type: string, format: date-time } }
    responses:
      '200':
        description: Dashboard payload