list:
  get:
    tags: [updates]
    summary: List updates for user's saved places
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: place_id, in: query, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, default: 20 } }
    responses:
      '200':
        description: Paginated updates feed
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PaginatedResponse'
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'

detail:
  get:
    tags: [updates]
    summary: Get a single update
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: update_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Update detail
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessResponse'
      '404':
        $ref: '../components/schemas.yaml#/ErrorResponse'

acknowledge:
  post:
    tags: [updates]
    summary: Acknowledge an update
    description: Records that the authenticated user has seen the update.
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      - { name: update_id, in: path, required: true, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Acknowledged
      '401':
        $ref: '../components/schemas.yaml#/ErrorResponse'