app_env: production

server:
  host: ""
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  shutdown_timeout: 30s
  # Origins allowed to call this API from the browser (comma-separated).
  # On Render this is set via GC_CORS_ALLOWED_ORIGINS to the web service URL.
  cors_allowed_origins: []
  cors_allow_credentials: true
  # Apply pending migrations on startup so no separate migrate step is required.
  run_migrations: true

logging:
  level: info
  format: json

database:
  url: ""
  max_conns: 10
  min_conns: 0
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  health_check_period: 1m

auth:
  secret: ""
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  issuer: green-compass
