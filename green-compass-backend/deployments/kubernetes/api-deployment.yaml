apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencompass-api
  namespace: greencompass
  labels:
    app: greencompass-api
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greencompass-api
  template:
    metadata:
      labels:
        app: greencompass-api
        component: api
    spec:
      containers:
        - name: api
          image: greencompass-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: greencompass-config
            - secretRef:
                name: greencompass-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /v1/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
