apiVersion: v1
kind: ConfigMap
metadata:
  name: greencompass-config
  namespace: greencompass
data:
  GC_APP_ENV: "production"
  GC_SERVER_HOST: "0.0.0.0"
  GC_SERVER_PORT: "8080"
  GC_LOG_LEVEL: "info"
  GC_LOG_FORMAT: "json"
  GC_AUTH_ISSUER: "greencompass"
  configs/config.production.yaml: |
    app_env: production
    server:
      host: 0.0.0.0
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
      shutdown_timeout: 30s
    logging:
      level: info
      format: json
    auth:
      issuer: greencompass
      access_token_ttl: 15m
      refresh_token_ttl: 720h
