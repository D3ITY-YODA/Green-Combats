# Render deployment manifest for Green Compass.
#
# Deploys three services:
#   1. green-compass-db   – PostGIS database (private service, internal network only)
#   2. green-compass-api  – Go backend API (public web service)
#   3. green-compass-web  – Next.js frontend (public web service)
#
# Create these as a "Blueprint" by connecting this repo to Render and selecting
# the render.yaml file, or create each service individually.
#
# NOTE: Render's managed Postgres does NOT include the PostGIS extension that
# this backend requires (GEOGRAPHY columns), so we run PostGIS ourselves as a
# private service instead.

services:
  # ---------------------------------------------------------------------------
  # PostGIS database (required by the migrations)
  # ---------------------------------------------------------------------------
  - type: pserv
    name: green-compass-db
    runtime: docker
    dockerImage: postgis/postgis:16-3.4
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: greencompass
      - key: POSTGRES_DB
        value: greencompass
      # sync: false makes Render generate a strong random password for you.
      - key: POSTGRES_PASSWORD
        sync: false
    # Persist the Postgres data directory across restarts/deploys.
    # (A disk is billable; on the free plan you may remove this block, at the
    #  cost of losing data whenever the service is rebuilt.)
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # ---------------------------------------------------------------------------
  # Go backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: green-compass-api
    runtime: docker
    dockerfilePath: ./green-compass-backend/Dockerfile
    plan: free
    # The API exposes /health for health checks.
    healthCheckPath: /health
    envVars:
      - key: GC_APP_ENV
        value: production
      # Render injects the listen port via PORT; the API reads it automatically.
      - key: PORT
        sync: false
      # Connection string to the PostGIS private service defined above.
      - key: GC_DATABASE_URL
        value: postgres://greencompass:$(green-compass-db.POSTGRES_PASSWORD)@$(green-compass-db.HOST):5432/greencompass?sslmode=disable
      # Apply pending migrations on startup so no separate migrate step is needed.
      - key: GC_RUN_MIGRATIONS
        value: "true"
      # Allow the browser frontend to call this API cross-origin.
      # For production you may restrict this to your frontend's exact origin.
      - key: GC_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GC_CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: GC_AUTH_ISSUER
        value: green-compass
      - key: GC_LOG_LEVEL
        value: info
      - key: GC_LOG_FORMAT
        value: json
      # sync: false generates a strong random JWT signing secret.
      - key: GC_AUTH_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: green-compass-web
    runtime: node
    rootDir: ./frontend-web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Public URL of the API service above. Update if you rename the service.
      - key: NEXT_PUBLIC_API_URL
        value: https://green-compass-api.onrender.com
