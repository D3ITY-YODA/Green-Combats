# render.yaml — Green Compass single-container deployment
#
# Builds both backend + frontend from the root Dockerfile.
# External traffic hits the frontend on :3000.
# Backend runs internally on :8080.
#
# Deploy:
#   1. Push to repo
#   2. Render Dashboard → New → Blueprint → connect repo
#   3. Render detects render.yaml and creates services
#   4. Seed DB after first deploy (shell into service, run: /usr/local/bin/api seed)

services:
  # ── Green Compass (backend + frontend in one container) ──────────
  - type: web
    name: greencompass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Backend config
      - key: GC_APP_ENV
        value: production
      - key: GC_SERVER_HOST
        value: "0.0.0.0"
      - key: GC_SERVER_PORT
        value: "8080"
      - key: GC_LOG_LEVEL
        value: info
      - key: GC_LOG_FORMAT
        value: json
      - key: GC_DATABASE_URL
        fromDatabase:
          name: greencompass-db
          property: connectionString
      - key: GC_AUTH_SECRET
        generateValue: true
      - key: GC_AUTH_ISSUER
        value: green-compass
      # Frontend config
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: Green Compass
      - key: NEXT_PUBLIC_API_URL
        value: http://localhost:8080
      - key: NEXT_PUBLIC_DEFAULT_LOCALE
        value: en
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: greencompass-db
    plan: starter
    databaseName: greencompass
    ipAllowList: []
